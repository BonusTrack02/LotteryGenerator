name: Google Play CD

on:
  push:
    tags:
      - '*-beta'
      - '*-prod'
  workflow_dispatch:
    inputs:
      target:
        description: Google Play deployment target
        required: true
        default: internal
        type: choice
        options:
          - internal
          - production
      version_code:
        description: Existing internal versionCode to promote (production only)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish_internal:
    name: Publish to internal testing
    if: >-
      (github.event_name == 'push' && endsWith(github.ref_name, '-beta')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'internal')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: google-play-internal
    concurrency:
      group: google-play-internal
      cancel-in-progress: false

    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      ADMOB_APPLICATION_ID: ${{ secrets.ADMOB_APPLICATION_ID }}
      ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      ADMOB_NATIVE_AD_ID: ${{ secrets.ADMOB_NATIVE_AD_ID }}
      ADMOB_WEBVIEW_BANNER_AD_ID: ${{ secrets.ADMOB_WEBVIEW_BANNER_AD_ID }}
      ADMOB_APP_OPEN_AD_ID: ${{ secrets.ADMOB_APP_OPEN_AD_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Google Cloud configuration
        shell: bash
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          : "${WORKLOAD_IDENTITY_PROVIDER:?GCP_WORKLOAD_IDENTITY_PROVIDER is required}"
          : "${SERVICE_ACCOUNT:?GCP_SERVICE_ACCOUNT is required}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate deployment secrets
        shell: bash
        run: |
          : "${GOOGLE_SERVICES_JSON_BASE64:?GOOGLE_SERVICES_JSON_BASE64 is required}"
          : "${UPLOAD_KEYSTORE_BASE64:?UPLOAD_KEYSTORE_BASE64 is required}"
          : "${SIGNING_STORE_PASSWORD:?UPLOAD_STORE_PASSWORD is required}"
          : "${SIGNING_KEY_ALIAS:?UPLOAD_KEY_ALIAS is required}"
          : "${SIGNING_KEY_PASSWORD:?UPLOAD_KEY_PASSWORD is required}"
          : "${ADMOB_APPLICATION_ID:?ADMOB_APPLICATION_ID is required}"
          : "${ADMOB_BANNER_AD_ID:?ADMOB_BANNER_AD_ID is required}"
          : "${ADMOB_NATIVE_AD_ID:?ADMOB_NATIVE_AD_ID is required}"
          : "${ADMOB_WEBVIEW_BANNER_AD_ID:?ADMOB_WEBVIEW_BANNER_AD_ID is required}"
          : "${ADMOB_APP_OPEN_AD_ID:?ADMOB_APP_OPEN_AD_ID is required}"

      - name: Create release configuration
        shell: bash
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

          cat > local.properties <<PROPERTIES
          sdk.dir=$ANDROID_HOME
          admobApplicationId=$ADMOB_APPLICATION_ID
          admobBannerAdId=$ADMOB_BANNER_AD_ID
          admobNativeAdId=$ADMOB_NATIVE_AD_ID
          admobWebViewBannerAdId=$ADMOB_WEBVIEW_BANNER_AD_ID
          admobAppOpenAdId=$ADMOB_APP_OPEN_AD_ID
          PROPERTIES

          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Publish app bundle to internal testing
        run: ./gradlew publishReleaseBundle --track internal --release-status completed --no-daemon

      - name: Upload signed app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lottery-generator-release-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  promote_production:
    name: Promote to production
    if: >-
      (github.event_name == 'push' && endsWith(github.ref_name, '-prod')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: google-play-production
    concurrency:
      group: google-play-production
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Google Cloud configuration
        shell: bash
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          : "${WORKLOAD_IDENTITY_PROVIDER:?GCP_WORKLOAD_IDENTITY_PROVIDER is required}"
          : "${SERVICE_ACCOUNT:?GCP_SERVICE_ACCOUNT is required}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Resolve production version code
        id: release
        shell: bash
        env:
          MANUAL_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version_code="$MANUAL_VERSION_CODE"
          elif [[ "$GITHUB_REF_NAME" =~ \+([0-9]+)-prod$ ]]; then
            version_code="${BASH_REMATCH[1]}"
          else
            echo "Production tags must include the versionCode, for example 2.12.0+19-prod." >&2
            exit 1
          fi

          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "A positive numeric versionCode is required for production promotion." >&2
            exit 1
          fi

          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Promote internal release to production
        run: >-
          ./gradlew promoteReleaseArtifact
          --from-track internal
          --promote-track production
          --version-code ${{ steps.release.outputs.version_code }}
          --release-status completed
          --no-daemon
