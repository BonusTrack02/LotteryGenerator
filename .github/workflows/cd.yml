name: Google Play CD

on:
  push:
    tags:
      - '*-prod'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: google-play-internal

    env:
      ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      ADMOB_APPLICATION_ID: ${{ secrets.ADMOB_APPLICATION_ID }}
      ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      ADMOB_NATIVE_AD_ID: ${{ secrets.ADMOB_NATIVE_AD_ID }}
      ADMOB_WEBVIEW_BANNER_AD_ID: ${{ secrets.ADMOB_WEBVIEW_BANNER_AD_ID }}
      ADMOB_APP_OPEN_AD_ID: ${{ secrets.ADMOB_APP_OPEN_AD_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate deployment secrets
        shell: bash
        run: |
          : "${ANDROID_PUBLISHER_CREDENTIALS:?PLAY_SERVICE_ACCOUNT_JSON is required}"
          : "${GOOGLE_SERVICES_JSON_BASE64:?GOOGLE_SERVICES_JSON_BASE64 is required}"
          : "${UPLOAD_KEYSTORE_BASE64:?UPLOAD_KEYSTORE_BASE64 is required}"
          : "${SIGNING_STORE_PASSWORD:?UPLOAD_STORE_PASSWORD is required}"
          : "${SIGNING_KEY_ALIAS:?UPLOAD_KEY_ALIAS is required}"
          : "${SIGNING_KEY_PASSWORD:?UPLOAD_KEY_PASSWORD is required}"
          : "${ADMOB_APPLICATION_ID:?ADMOB_APPLICATION_ID is required}"
          : "${ADMOB_BANNER_AD_ID:?ADMOB_BANNER_AD_ID is required}"
          : "${ADMOB_NATIVE_AD_ID:?ADMOB_NATIVE_AD_ID is required}"
          : "${ADMOB_WEBVIEW_BANNER_AD_ID:?ADMOB_WEBVIEW_BANNER_AD_ID is required}"
          : "${ADMOB_APP_OPEN_AD_ID:?ADMOB_APP_OPEN_AD_ID is required}"

      - name: Create release configuration
        shell: bash
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

          cat > local.properties <<PROPERTIES
          sdk.dir=$ANDROID_HOME
          admobApplicationId=$ADMOB_APPLICATION_ID
          admobBannerAdId=$ADMOB_BANNER_AD_ID
          admobNativeAdId=$ADMOB_NATIVE_AD_ID
          admobWebViewBannerAdId=$ADMOB_WEBVIEW_BANNER_AD_ID
          admobAppOpenAdId=$ADMOB_APP_OPEN_AD_ID
          PROPERTIES

          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Publish app bundle to internal testing
        run: ./gradlew publishReleaseBundle --track internal --release-status completed --no-daemon

      - name: Upload signed app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lottery-generator-release-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
